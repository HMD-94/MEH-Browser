<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0d1527" />
      <stop offset="50%" stopColor="#080d19" />
      <stop offset="100%" stopColor="#03060c" />
    </linearGradient>

    <!-- Glass Radial Highlight -->
    <radialGradient id="glassLight" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.22" />
      <stop offset="50%" stopColor="#38bdf8" stopOpacity="0.04" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="40%" stopColor="#0ea5e9" />
      <stop offset="70%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- MEH Monogram Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="45%" stopColor="#ffffff" />
      <stop offset="75%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#93c5fd" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Logo Glow -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feFlood flood-color="#38bdf8" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="shadow" />
      <feComposite in="SourceGraphic" in2="shadow" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Neon Border & Glow -->
  <!-- Outer glow rect -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104"
        fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.35" filter="url(#neonGlow)" />

  <!-- Main Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104"
        fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="7" />

  <!-- Glass Inner Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104"
        fill="url(#glassLight)" />

  <!-- Logo Group Scaled and Centered -->
  <g transform="translate(256, 260) scale(3.1) translate(-50, -50)" filter="url(#logoGlow)">
    <!-- Cyan Top Dot -->
    <circle cx="50" cy="18" r="6" fill="#38bdf8" />
    
    <!-- Stylized Futuristic MEH M -->
    <path
      d="M20 75 V28 L40 54 L50 42 L60 54 L80 28 V75"
      stroke="url(#mGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>